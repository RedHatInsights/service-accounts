name: Chromatic Deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: chromatic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  chromatic:
    uses: RedHatInsights/shared-workflows/.github/workflows/reusable-chromatic.yml@fdaa8fa249caa5c09ef9661f8b4222ae9125095d # main
    secrets:
      chromatic-project-token: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
