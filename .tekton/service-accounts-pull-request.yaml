apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/RedHatInsights/service-accounts?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch
      == "main"
    pipelinesascode.tekton.dev/pipeline: https://github.com/RedHatInsights/konflux-pipelines/raw/main/pipelines/platform-ui/docker-build-run-all-tests-v3.yaml
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: service-accounts
    appstudio.openshift.io/component: service-accounts
    pipelines.appstudio.openshift.io/type: build
  name: service-accounts-on-pull-request
  namespace: rh-platform-experien-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/rh-platform-experien-tenant/service-accounts/service-accounts:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: build-tools/Dockerfile.hermetic
  - name: target-stage
    value: deploy
  - name: build-args
    value:
    - "LABEL_COMPONENT=service-accounts-hermetic"
    - "LABEL_DESCRIPTION=Service Accounts Frontend - Hermetic Build"
    - "LABEL_URL=https://github.com/RedHatInsights/service-accounts"
    - "LABEL_SUMMARY=Service Accounts Frontend"
  - name: hermetic
    value: "true"
  - name: prefetch-input
    value: '{"type": "npm", "path": "."}'
  - name: path-context
    value: .
  - name: rebuild
    value: "true"
  - name: e2e-app-port
    value: "8000"
  - name: e2e-playwright-image
    value: mcr.microsoft.com/playwright:v1.59.1-noble
  - name: workspace-setup-script
    value: |
      #!/bin/bash
      set -ex

      npm install
  - name: unit-tests-script
    value: |
      #!/bin/bash
      set -ex

      npm run lint
      npm run lint:translations
      npm test -- --runInBand --no-cache
  - name: run-app-command
    value: caddy
  - name: run-app-args
    value:
    - run
    - --config
    - /etc/caddy/Caddyfile
    - --adapter
    - caddyfile
  - name: e2e-base-url
    value: "https://stage.foo.redhat.com:1337/"
  - name: e2e-proxy-readiness-url
    value: "https://stage.foo.redhat.com:1337/"
  - name: e2e-tests-script
    value: |
      #!/bin/bash
      set -ex

      echo "Running Playwright tests..."
      npm run test:playwright
  - name: e2e-credentials-secret
    value: service-accounts-credentials-secret
  - name: frontend-proxy-routes-configmap
    value: service-accounts-dev-proxy-caddyfile
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/RedHatInsights/konflux-pipelines
    - name: revision
      value: main
    - name: pathInRepo
      value: pipelines/platform-ui/docker-build-run-all-tests-v3.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-service-accounts
  taskRunSpecs:
    - pipelineTaskName: run-e2e-tests
      serviceAccountName: build-pipeline-service-accounts
      podTemplate:
        # Override /etc/hosts to redirect stage.foo.redhat.com to localhost
        hostAliases:
          - ip: "::1"
            hostnames:
              - "stage.foo.redhat.com"
          - ip: "127.0.0.1"
            hostnames:
              - "stage.foo.redhat.com"
  workspaces:
  - name: workspace
    volumeClaimTemplate:
      metadata:
        creationTimestamp: null
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
      status: {}
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
